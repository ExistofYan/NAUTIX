spring:
  application:
    name: shipsensor

  datasource:
    # 默认连本机 MySQL（当前机器已运行 MySQL80，ship_sensor 库与全部表都在本地）。
    # 如需连回校园网/实验室的远程库，设置环境变量 DB_URL 即可覆盖，例如：
    #   DB_URL=jdbc:mysql://10.20.102.202:3306/ship_sensor?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    url: ${DB_URL:jdbc:mysql://localhost:3306/ship_sensor?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&connectTimeout=5000&socketTimeout=60000}
    username: ${DB_USERNAME:tongyan}
    password: ${DB_PASSWORD:2005}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      # 数据库暂时不可用时不要在建池阶段直接失败，
      # 避免个别启动初始化查库把整个应用启动带崩
      initialization-fail-timeout: -1
      connection-timeout: 5000
      maximum-pool-size: 50
      minimum-idle: 5


  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false



server:
  port: 1910
  servlet:
    context-path: /api
  compression:
    # JSON 文本重复度高，压缩后体积通常能降到 1/10 以下，
    # 大列表接口的传输时间随之大幅下降
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 2048



mybatis-plus:

  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: shipsensor.entity

  global-config:
    db-config:
      id-type: auto

  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: batch


simulator:
  enabled: false

  sensor-config:
    enabled: false


  sensor-data:
    enabled: false

    interval: 1000

    batch-size: 50000

    initializer:
      route-enabled: false
      runtime-status-enabled: false
      alert-enabled: false

  # 低频实时数据生成（独立于 simulator.enabled 总开关，不会启用高频模拟器）
  # 每 interval-seconds 秒随机抽取 per-tick 个传感器各生成 1 条数据
  # 默认 10 秒 x 10 条 ≈ 8.6 万条/天，长期部署可接受；需要更慢请调大周期或调小抽样数
  realtime:
    enabled: true
    interval-seconds: 10
    per-tick: 10

# JWT Configuration
jwt:
  secret-key: shipsensor-secret-key-2024-nautix-maritime-platform-jwt-signature
  expiration: 86400000  # 24 hours in milliseconds